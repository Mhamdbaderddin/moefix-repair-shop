<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | MOFIXA</title>
    <link rel="icon" href="images/mofixa-logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <header class="site-header">
        <a class="logo" href="index.html#top" aria-label="MOFIXA home">
            <img class="logo-mark" src="images/mofixa-logo.svg" alt="" width="36" height="36">
            <span>MOFIXA</span>
        </a>

        <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-navigation">Menu</button>

        <nav class="site-navigation" id="site-navigation" aria-label="Main navigation">
            <a href="index.html#top">Home</a>
            <a href="index.html#services">Services</a>
            <a href="index.html#shop">Shop</a>
            <a href="index.html#about">About</a>
            <a href="index.html#contact">Contact</a>
            <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
            <span id="auth-nav" class="auth-nav"></span>
        </nav>
    </header>

    <main>
        <section class="auth-section">
            <div class="auth-card">
                <p class="section-tag">ACCOUNT</p>
                <h1>Create account</h1>
                <p>Register to track orders and book repairs faster.</p>

                <form id="register-form" novalidate>
                    <label for="register-name">Full name</label>
                    <input type="text" id="register-name" name="name" autocomplete="name">
                    <p class="field-error" id="register-name-error" aria-live="polite"></p>

                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" name="email" autocomplete="email">
                    <p class="field-error" id="register-email-error" aria-live="polite"></p>

                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" name="password" autocomplete="new-password">
                    <p class="field-error" id="register-password-error" aria-live="polite"></p>

                    <label for="register-confirm">Confirm password</label>
                    <input type="password" id="register-confirm" name="confirm" autocomplete="new-password">
                    <p class="field-error" id="register-confirm-error" aria-live="polite"></p>

                    <button type="submit">Register</button>
                    <p class="form-status" id="register-status" aria-live="polite"></p>
                </form>

                <p class="auth-switch">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-copy">
            <p>&copy; 2026 MOFIXA. All rights reserved.</p>
        </div>
    </footer>

    <script src="config.js"></script>
    <script src="products.js"></script>
    <script src="cart.js"></script>
    <script src="auth.js"></script>
    <script src="nav.js"></script>

</body>

</html>
